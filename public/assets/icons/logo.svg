<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3d25"/>
      <stop offset="50%" stop-color="#1a5c38"/>
      <stop offset="100%" stop-color="#2d7a4f"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b84a"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6a12"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1"/>
      <stop offset="50%" stop-color="#ffd54f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="12"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,8" opacity="0.6"/>

  <!-- Lantern Chain -->
  <line x1="256" y1="40" x2="256" y2="110" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="115" r="8" fill="url(#goldGrad)"/>

  <!-- Lantern Top Dome -->
  <path d="M 226 140 Q 256 120 286 140 L 296 160 L 216 160 Z" fill="url(#goldGrad)"/>

  <!-- Glowing Light inside Lantern -->
  <circle cx="256" cy="210" r="50" fill="url(#lanternGlow)"/>

  <!-- Flame -->
  <path d="M 256 180 Q 266 205 256 225 Q 246 205 256 180 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 256 190 Q 262 208 256 220 Q 250 208 256 190 Z" fill="#ffd54f"/>

  <!-- Lantern Glass Body Structure -->
  <path d="M 216 160 L 296 160 L 286 260 L 226 260 Z" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
  <!-- Glass Curves -->
  <path d="M 256 160 Q 276 210 256 260" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7"/>
  <path d="M 256 160 Q 236 210 256 260" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.7"/>

  <!-- Lantern Base -->
  <path d="M 220 260 L 292 260 L 276 280 L 236 280 Z" fill="url(#goldGrad)"/>
  <circle cx="256" cy="288" r="6" fill="url(#goldGrad)"/>

  <!-- Arabic Calligraphy "مِشْكَاة" -->
  <text x="256" y="375" font-family="'Amiri', 'Traditional Arabic', serif" font-size="64" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">
    مِشْكَاة
  </text>

  <!-- Tagline: MISYKAH -->
  <text x="256" y="415" font-family="'Poppins', sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    MISYKAH
  </text>
  
  <text x="256" y="440" font-family="'Poppins', sans-serif" font-size="12" font-weight="400" fill="#e0b84a" text-anchor="middle" letter-spacing="2" opacity="0.85">
    PLATFORM RESMI SANTRI
  </text>
</svg>
